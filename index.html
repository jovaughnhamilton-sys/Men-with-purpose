{ref:'2 Corinthians 5:17',body:'Your past is part of your story, but it does not have to be your identity. In Christ, you are invited into a new life. Today, refuse to let yesterday’s failures write tomorrow’s decisions.',prayer:'Father, help me live as someone renewed by Your grace. Give me courage to leave old patterns behind.',challenge:'Encourage one man who needs a fresh start.'},

const menInTheWord=[{"name":"Paul: A New Beginning","ref":"Acts 9:1–22","story":"Saul was on his way to Damascus to arrest followers of Jesus when the risen Jesus confronted him. His journey changed direction. He was led into the city unable to see, and Ananias came to him despite knowing his reputation. Saul, later known as Paul, was baptized and began proclaiming Jesus. The man who had persecuted believers became a witness to the One he had opposed.","struggle":"Paul had to face the truth about his past and receive help from the people he had harmed. A new beginning meant a new direction, not pretending his past had never happened.","takeaway":"Being a new creation in Christ changes how you live. You can acknowledge your mistakes, receive grace, and begin making different choices today.","questions":["What old label or failure am I allowing to define me?","Where do I need to accept grace and take responsibility?","What new choice can I make today?"]},{"name":"Bezalel: Made for Meaningful Work","ref":"Exodus 31:1–11; 35:30–35","story":"When God gave instructions for the tabernacle, He called Bezalel by name and equipped him with wisdom, understanding, and skill. Bezalel worked with gold, stone, wood, and other materials. He and Oholiab were also given the ability to teach others. His craftsmanship helped the community carry out the work God had entrusted to them.","struggle":"This calling required skill, care, and cooperation. Bezalel's contribution reminds us that faithful work can happen through practical abilities, not only through public speaking or a prominent title.","takeaway":"Your abilities can serve a purpose beyond recognition or income. Use what you have faithfully, and help someone else grow.","questions":["What ability have I been overlooking or taking for granted?","Who could benefit from my skills today?","How can I do my work with greater care?"]},{"name":"Paul: Grace in Weakness","ref":"2 Corinthians 12:7–10","story":"Paul described a painful difficulty as a thorn in his flesh. He asked the Lord three times to take it away. Instead of receiving the removal he requested, he received the assurance that God's grace was sufficient and His power was made perfect in weakness. Paul learned to depend on Christ amid hardship. The passage does not identify exactly what the thorn was.","struggle":"Paul's prayer did not produce the relief he wanted. He had to learn dependence without pretending that his suffering was easy.","takeaway":"You can ask God for relief and still trust Him when the answer is different from what you hoped. Needing help does not make your faith a failure.","questions":["Where am I pretending to be stronger than I feel?","What help or prayer do I need to ask for?","What would depending on God's grace look like today?"]},{"name":"Joseph: Love That Protects","ref":"Matthew 1:18–25; 2:13–15, 19–23","story":"When Joseph learned that Mary was pregnant, he planned to end their engagement quietly rather than expose her to public disgrace. After an angel explained what God was doing, Joseph took Mary as his wife. Later, warned in a dream about Herod's threat, he took Mary and Jesus to Egypt. When it was safe to return, he continued caring for his family.","struggle":"Joseph faced uncertainty, a disrupted future, and the responsibility of protecting others. He responded with obedience and concrete acts of care.","takeaway":"Loving leadership is more than words. It means protecting dignity, listening to God, and accepting responsibility for the well-being of those entrusted to your care.","questions":["Do the people closest to me experience my leadership as care?","Where is pride getting in the way of love?","What practical act of care can I offer today?"]},{"name":"Joseph: Faith Through Hardship","ref":"Genesis 37:23–28; 39:1–23; 41:39–41; 50:19–21","story":"Joseph's brothers sold him into slavery. In Egypt, he served in Potiphar's household, resisted wrongdoing, and was imprisoned after a false accusation. Genesis describes God being with him in both service and prison. Years later, Joseph was placed in authority under Pharaoh and helped preserve lives during famine. When he met his brothers again, he acknowledged their evil while recognizing God's work in preserving life.","struggle":"Joseph endured betrayal and injustice without a clear view of how his story would unfold. His eventual position does not erase the wrong done to him.","takeaway":"Faithfulness matters even when circumstances are unfair. Joseph's story invites trust in God, without promising that every hardship will lead to wealth or status.","questions":["What uncertainty am I carrying right now?","Where can I remain faithful while seeking help and wise counsel?","What is the next responsible step within my reach?"]},{"name":"Joshua: Courage for the Next Step","ref":"Joshua 1:1–9; 3:7–17","story":"After Moses died, Joshua was given the responsibility of leading Israel into the promised land. God called him to courage, obedience, and attention to His instruction. At the Jordan River, the priests carrying the ark stepped into the water as directed, and the people crossed on dry ground. Joshua's leadership depended on God's presence and guidance.","struggle":"Joshua faced a major transition and a responsibility larger than he could carry alone. Courage was connected to obedience, not confidence in his own strength.","takeaway":"You do not need to feel fearless to take a faithful step. Seek God's guidance, prepare responsibly, and act on the responsibility in front of you.","questions":["What responsibility have I been postponing because of fear?","What guidance or preparation do I need?","What small, faithful step can I take today?"]},{"name":"Barnabas: Encouragement That Opens Doors","ref":"Acts 4:36–37; 9:26–28; 11:22–26","story":"Barnabas sold a field and gave the proceeds to support the believers. When Saul came to Jerusalem and the disciples were afraid of him, Barnabas brought him to the apostles and explained his encounter with Jesus. Later, in Antioch, Barnabas encouraged the believers to remain faithful and brought Saul to help teach the growing church.","struggle":"Barnabas had to look beyond fear and reputation while taking another person's transformation seriously. His encouragement included generosity, advocacy, and shared work.","takeaway":"You can make a difference by helping others take their next step. Encouragement becomes powerful when it includes practical support and a willingness to make room for someone.","questions":["Who needs encouragement or a fair opportunity from me?","Am I judging someone only by their past?","What practical support can I give today?"]}];
function reflectionEntry(day){return journal().find(x=>x.id==='reflection-day-'+day)}
function saveReflection(){
 const field=document.getElementById('personalReflection'),status=document.getElementById('reflectionStatus');
 const text=field.value.trim();if(!text){status.textContent='Write a reflection before saving.';return}
 const id='reflection-day-'+selected,entries=journal(),previous=entries.find(x=>x.id===id);
 const entry={id,date:previous?.date||new Date().toISOString(),updatedAt:new Date().toISOString(),text,answered:previous?.answered||false,day:selected,theme:themes[selected-1]};
 const next=entries.filter(x=>x.id!==id);next.unshift(entry);
 try{put('journalEntries',next);status.textContent='Reflection saved in your journal.'}catch(e){status.textContent='Could not save. Copy your reflection somewhere safe and try again.'}
}
function storySection(day){
 const s=menInTheWord[day-1];if(!s)return '';
 return `<section class="card" aria-labelledby="storyHeading"><div class="eyebrow">A Man in the Word</div><h3 id="storyHeading">${esc(s.name)}</h3><p class="muted">${esc(s.ref)}</p><p>${esc(s.story)}</p><h3>His Struggle</h3><p>${esc(s.struggle)}</p><h3>What We Can Take Away</h3><p>${esc(s.takeaway)}</p></section>`;
}
function reflectionSection(day){
 const s=menInTheWord[day-1],entry=reflectionEntry(day);
 const questions=s?.questions||['What does this theme bring to mind in my own life?','What am I struggling to trust God with right now?','What faithful step can I take today?'];
 return `<section class="card" aria-labelledby="reflectionHeading"><h3 id="reflectionHeading">Personal Reflection</h3><p class="muted">Take a moment to be honest with God and yourself.</p><ol>${questions.map(q=>`<li><p>${esc(q)}</p></li>`).join('')}</ol><label for="personalReflection"><strong>My thoughts, prayers, and what I am learning today</strong></label><textarea id="personalReflection" placeholder="Write your personal reflection here…">${esc(entry?.text||'')}</textarea><p class="notice">Save your reflection before leaving this page. It stays on this device and is included in your journal backups.</p><div class="toolbar"><button class="btn" onclick="saveReflection()">Save reflection</button><button class="btn alt" onclick="tab('journal')">View my journal</button></div><div id="reflectionStatus" role="status"></div></section>`;
}

const bibleBooks=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
const chapterCounts=[50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];
const K='mop-v1-',get=(k,d)=>{try{const x=localStorage.getItem(storageKey(k));return x===null?d:JSON.parse(x)}catch{return d}},put=(k,v)=>{localStorage.setItem(storageKey(k),JSON.stringify(v));accountChanged()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let screen='home',selected=1,bibleBook='John',bibleChapter=1,bibleCache={},currentVerses=[],currentRef='',cloudClient=null,cloudUser=null;
const content=document.getElementById('content');
function completed(){return get('completed',[])}
function bookmarks(){return get('bookmarks',[])}
function journal(){const entries=get('journalEntries',null);if(entries)return entries;const legacy=get('notes','');return legacy?[{id:'legacy',date:new Date().toISOString(),text:legacy,answered:false}]:[]}
function today(){return new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function greeting(){let h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function nextDay(){return Array.from({length:40},(_,i)=>i+1).find(n=>!completed().includes(n))||40}
function tab(s){screen=s;render()}
function openDay(n){selected=n;screen='reader';render()}
function mark(){let a=completed();if(!a.includes(selected))a.push(selected);put('completed',a);render()}
function toggleDone(n){let a=completed();put('completed',a.includes(n)?a.filter(x=>x!==n):[...a,n]);render()}
function streak(){let dates=get('readingDates',[]).sort().reverse(),now=new Date(),count=0;for(let i=0;i<365;i++){let d=new Date(now);d.setDate(now.getDate()-i);let iso=d.toLocaleDateString('en-CA');if(dates.includes(iso))count++;else if(i>0||dates.length&&dates[0]!==new Date(now.getTime()-86400000).toLocaleDateString('en-CA'))break}return count}
function trackReading(){let ds=get('readingDates',[]),d=new Date().toLocaleDateString('en-CA');if(!ds.includes(d)){ds.push(d);put('readingDates',ds)}}
function shareText(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Copied. Share it with a friend.'));else prompt('Copy this message:',t)}
function shareDay(){shareText(`MEN OF PURPOSE — Day ${selected}: ${themes[selected-1]}\nRead ${readings[selected-1]?.ref||'today’s Scripture'} (WEB).\nRooted in Christ. Strengthened by Faith. Called to Lead.\n${location.href}`)}
function changeName(){const e=document.getElementById('displayName');put('name',e.value.trim().slice(0,50));render()}
function setFont(n){let v=Math.min(26,Math.max(14,get('fontSize',18)+n));put('fontSize',v);document.documentElement.style.setProperty('--reader-size',v+'px');const t=document.getElementById('fontLabel');if(t)t.textContent=v+'px'}
function bookKey(v){return `${v.book} ${v.chapter}:${v.verse}`}
function toggleBookmark(book,chapter,verse,text){let a=bookmarks(),key=`${book} ${chapter}:${verse}`;if(a.some(x=>bookKey(x)===key))a=a.filter(x=>bookKey(x)!==key);else a.push({book,chapter,verse,text});put('bookmarks',a);renderBibleText();const count=document.getElementById('bookmarkCount');if(count)count.textContent=a.length}
function renderBibleText(){const el=document.getElementById('bibleText');if(!el||!currentVerses.length)return;const saved=new Set(bookmarks().map(bookKey));el.innerHTML='<div class="eyebrow">World English Bible · Public Domain</div><p class="muted small">Tap any verse to save or remove its bookmark.</p><div class="scripture">'+currentVerses.map((v,i)=>{const key=`${v.book_name||bibleBook} ${v.chapter||bibleChapter}:${v.verse}`;return `<p><button class="chapter-verse ${saved.has(key)?'saved':''}" data-verse="${i}" title="Bookmark verse ${v.verse}"><span class="verse-number">${v.verse}${saved.has(key)?' ★':''}</span>${esc(v.text)}</button></p>`}).join('')+'</div>';el.querySelectorAll('[data-verse]').forEach(btn=>btn.addEventListener('click',()=>{let v=currentVerses[Number(btn.dataset.verse)];toggleBookmark(v.book_name||bibleBook,v.chapter||bibleChapter,v.verse,v.text)}))}
async function loadBible(ref,target='bibleText'){
const el=document.getElementById(target);if(!el)return;el.innerHTML='<p class="muted">Loading WEB Scripture…</p>';try{const response=await fetch('https://bible-api.com/'+encodeURIComponent(ref)+'?translation=web');if(!response.ok)throw Error('unavailable');const data=await response.json();if(!data.verses?.length)throw Error('no verses');if(!document.getElementById(target))return;if(target==='bibleText'){currentVerses=data.verses;currentRef=ref;renderBibleText();trackReading()}else document.getElementById(target).innerHTML='<div class="eyebrow">World English Bible</div><div class="scripture">'+data.verses.map(v=>`<p><span class="verse-number">${v.verse}</span>${esc(v.text)}</p>`).join('')+'</div>';
}catch(e){let node=document.getElementById(target);if(node)node.innerHTML='<p class="muted">Scripture could not load. Check your connection and try again.</p><button class="btn alt" id="retryBible">Retry</button>',node.querySelector('#retryBible').onclick=()=>loadBible(ref,target)}}
function bibleSelect(){bibleBook=document.getElementById('bibleBook').value;bibleChapter=1;render()}
function bibleChapterSelect(){bibleChapter=Number(document.getElementById('bibleChapter').value);render()}
function bibleMove(d){let i=bibleBooks.indexOf(bibleBook),n=bibleChapter+d;if(n<1&&i>0){bibleBook=bibleBooks[i-1];bibleChapter=chapterCounts[i-1]}else if(n>chapterCounts[i]&&i<bibleBooks.length-1){bibleBook=bibleBooks[i+1];bibleChapter=1}else if(n>=1&&n<=chapterCounts[i])bibleChapter=n;render()}
function goBookmark(i){let v=bookmarks()[i];if(!v)return;bibleBook=v.book;bibleChapter=v.chapter;screen='bible';render()}
function removeBookmark(i){let a=bookmarks();a.splice(i,1);put('bookmarks',a);render()}
function saveJournal(){let el=document.getElementById('journalText'),txt=el.value.trim();if(!txt)return alert('Write a prayer or reflection first.');let a=journal();a.unshift({id:Date.now().toString(36),date:new Date().toISOString(),text:txt,answered:false});put('journalEntries',a);put('notes','');render()}
function toggleAnswered(id){put('journalEntries',journal().map(x=>x.id===id?{...x,answered:!x.answered}:x));render()}
function deleteJournal(id){if(confirm('Delete this journal entry? This cannot be undone.')){put('journalEntries',journal().filter(x=>x.id!==id));render()}}
function reminderSave(){put('reminder',{enabled:document.getElementById('reminderEnabled').checked,time:document.getElementById('reminderTime').value});render()}
function reminderCheck(){const r=get('reminder',{enabled:false,time:'09:00'}),now=new Date(),d=now.toLocaleDateString('en-CA');if(r.enabled&&get('lastReminder','')!==d){const [h,m]=(r.time||'09:00').split(':').map(Number);if(now.getHours()>h||now.getHours()===h&&now.getMinutes()>=m){put('lastReminder',d);setTimeout(()=>{if(confirm('Men of Purpose: Make time for today’s devotional. Open your journey?'))openDay(nextDay())},1200)}}}
function exportData(){const data={app:'Men of Purpose',version:2,exportedAt:new Date().toISOString(),name:get('name',''),completed:completed(),bookmarks:bookmarks(),journalEntries:journal(),readingDates:get('readingDates',[]),fontSize:get('fontSize',18),reminder:get('reminder',{enabled:false,time:'09:00'})};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='men-of-purpose-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(){document.getElementById('backupFile').click()}
async function restoreData(input){const f=input.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.app!=='Men of Purpose'||obj.version!==2||!Array.isArray(obj.completed)||!Array.isArray(obj.journalEntries)||!Array.isArray(obj.bookmarks))throw Error('Invalid backup');if(!confirm('Replace your current local progress, bookmarks and journal with this backup?'))return;for(const k of ['name','completed','bookmarks','journalEntries','readingDates','fontSize','reminder'])if(k in obj)put(k,obj[k]);render();alert('Backup restored on this device.')}catch(e){alert('Could not import this backup: '+e.message)}}
function scriptureCard(){const d=readings[selected-1],ref=d?.ref||'Psalm 23:1';const text=`MEN OF PURPOSE\n${themes[selected-1]}\n${ref} (WEB)\nRooted in Christ. Strengthened by Faith. Called to Lead.`;shareText(text)}
function shareCardImage(){const d=readings[selected-1],ref=d?.ref||'Psalm 23:1',canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;const c=canvas.getContext('2d');const g=c.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#142e25');g.addColorStop(1,'#2c5940');c.fillStyle=g;c.fillRect(0,0,1080,1080);c.strokeStyle='#c6a15b';c.lineWidth=8;c.strokeRect(45,45,990,990);c.textAlign='center';c.fillStyle='#e5c78a';c.font='bold 40px Georgia';c.fillText('MEN OF PURPOSE',540,180);c.fillStyle='#ffffff';c.font='bold 62px Georgia';const words=themes[selected-1].split(' '),lines=[];let line='';for(const word of words){if(c.measureText((line+' '+word).trim()).width>850&&line){lines.push(line);line=word}else line=(line+' '+word).trim()}lines.push(line);lines.forEach((l,i)=>c.fillText(l,540,400+i*84));c.fillStyle='#e5c78a';c.font='38px sans-serif';c.fillText(ref+' · WEB',540,650);c.fillStyle='#ffffff';c.font='26px sans-serif';c.fillText('Rooted in Christ. Strengthened by Faith.',540,860);c.fillText('Called to Lead.',540,900);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='men-of-purpose-day-'+selected+'.png';a.click()}
function render(){document.documentElement.style.setProperty("--reader-size",get("fontSize",18)+"px");for(let t of ['home','journey','journal','bible','more'])document.getElementById(t+'Tab').classList.toggle('active',screen===t||(screen==='reader'&&t==='journey'));let count=completed().length,nd=nextDay(),name=get('name','').trim(),rem=get('reminder',{enabled:false,time:'09:00'});document.documentElement.style.setProperty('--reader-size',get('fontSize',18)+'px');
if(screen==='home'){content.innerHTML=`<div class="greeting">${greeting()}${name?', '+esc(name):''} · ${today()}</div><h2>Walk with purpose today.</h2><div class="card"><div class="eyebrow">Your next step · Day ${nd} of 40</div><h2>${esc(themes[nd-1])}</h2><p class="muted">${esc(readings[nd-1]?.ref||'A Scripture-guided theme')}</p><p>Faith grows through everyday choices. Make time for God and take your next step.</p><button class="btn full" onclick="openDay(${nd})">${nd<=7?'Start today’s devotional':'Explore today’s theme'} →</button></div><div class="stats"><div class="stat"><strong>${count}/40</strong><small>Days completed</small></div><div class="stat"><strong>${streak()}</strong><small>Reading streak*</small></div><div class="stat"><strong id="bookmarkCount">${bookmarks().length}</strong><small>Saved verses</small></div></div><div class="card"><div class="row"><strong>Your faith journey</strong><span class="muted">${Math.round(count/40*100)}%</span></div><div class="progress" role="progressbar" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="40"><div class="bar" style="width:${count/40*100}%"></div></div><p class="muted">One day at a time. Progress stays on this device unless you connect an account.</p><button class="btn alt" onclick="tab('journey')">View 40-day journey</button></div><div class="card"><strong>Today’s Scripture</strong><p>“Therefore if anyone is in Christ, he is a new creation.”</p><p class="muted">2 Corinthians 5:17 · WEB</p><button class="btn alt" onclick="bibleBook='2 Corinthians';bibleChapter=5;tab('bible')">Read in the Bible →</button></div><p class="notice">*Reading streaks are based on days you open a Bible passage while connected.</p>`}
else if(screen==='journey'){content.innerHTML=`<div class="eyebrow">The 40-day faith journey</div><h2>Become the man God called you to be.</h2><p class="muted">${count} of 40 days marked complete. The first seven days contain full devotionals; the remaining days are theme previews while new content is written.</p><div class="progress"><div class="bar" style="width:${count/40*100}%"></div></div><div class="days">${themes.map((x,i)=>`<button class="day ${completed().includes(i+1)?'done':''} ${i+1>7?'locked':''}" onclick="openDay(${i+1})" title="Day ${i+1}: ${esc(x)}">${i+1}</button>`).join('')}</div><div class="card"><strong>Milestones</strong><p>${[7,21,40].map(n=>`${count>=n?'🏅':'○'} ${n}-day milestone`).join(' · ')}</p><p class="muted">Mark a day complete only after you've read or reflected on it.</p></div>`}
else if(screen==='reader'){let d=readings[selected-1];content.innerHTML=`<button class="btn alt" onclick="tab('journey')">← Journey</button><div class="eyebrow section-title">Day ${selected} of 40</div><h2>${esc(themes[selected-1])}</h2>${d?`<div class="card"><strong>Read God’s Word</strong><p class="muted">${esc(d.ref)} · WEB</p><div id="devotionalBible"></div><div class="toolbar"><button class="btn alt" onclick="setFont(-2)">A−</button><button class="btn alt" onclick="setFont(2)">A+</button><span id="fontLabel" class="muted">${get('fontSize',18)}px</span></div></div><div class="card"><div class="eyebrow">Devotional Message</div><p>${esc(d.body)}</p></div>${storySection(selected)}${reflectionSection(selected)}<div class="card"><div class="eyebrow">Today's challenge</div><p>${esc(d.challenge)}</p><div class="eyebrow">Closing Prayer</div><p>${esc(d.prayer)}</p></div>`:`<div class="card"><p class="pill">Theme preview · Full devotional coming soon</p><p>Spend time reflecting on <strong>${esc(themes[selected-1])}</strong>. Read a Bible chapter and ask God to guide your next step.</p><button class="btn alt" onclick="tab('bible')">Open Bible reader</button></div>${reflectionSection(selected)}`}<div class="card"><div class="eyebrow">Share encouragement</div><div class="share-card"><span class="gold">MEN OF PURPOSE</span><h3>${esc(themes[selected-1])}</h3><p>${esc(d?.ref||'40-day faith journey')} · WEB</p><small>Rooted in Christ. Strengthened by Faith. Called to Lead.</small></div><div class="toolbar"><button class="btn" onclick="shareCardImage()">Download share card</button><button class="btn alt" onclick="shareDay()">Share message</button></div></div><div class="toolbar"><button class="btn ${completed().includes(selected)?'alt':''}" onclick="toggleDone(${selected})">${completed().includes(selected)?'✓ Completed · Undo':'Mark day complete'}</button>${selected<40?`<button class="btn alt" onclick="openDay(${selected+1})">Next day →</button>`:''}</div>`;if(d)loadBible(d.ref,'devotionalBible')}
else if(screen==='bible'){const idx=bibleBooks.indexOf(bibleBook),max=chapterCounts[idx];content.innerHTML=`<div class="eyebrow">Read God's Word</div><h2>Holy Bible <span class="pill">WEB · Free</span></h2><p class="muted">All 66 books. Select a book and chapter. Internet is required to load Scripture.</p><div class="card"><div class="field"><label for="bibleBook">Book</label><select id="bibleBook" onchange="bibleSelect()">${bibleBooks.map(x=>`<option ${x===bibleBook?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="bibleChapter">Chapter</label><select id="bibleChapter" onchange="bibleChapterSelect()">${Array.from({length:max},(_,i)=>`<option value="${i+1}" ${i+1===bibleChapter?'selected':''}>Chapter ${i+1}</option>`).join('')}</select></div><div class="toolbar"><button class="btn alt" onclick="bibleMove(-1)">← Previous</button><button class="btn alt" onclick="bibleMove(1)">Next →</button><button class="btn alt" onclick="setFont(-2)">A−</button><button class="btn alt" onclick="setFont(2)">A+</button><span id="fontLabel" class="muted">${get('fontSize',18)}px</span></div></div><div class="card"><h2>${esc(bibleBook)} ${bibleChapter}</h2><div id="bibleText"></div></div><button class="btn alt" onclick="tab('saved')">★ Saved verses (${bookmarks().length})</button>`;currentVerses=[];loadBible(bibleBook+' '+bibleChapter)}
else if(screen==='saved'){let a=bookmarks();content.innerHTML=`<button class="btn alt" onclick="tab('bible')">← Bible</button><h2>Saved verses</h2>${a.length?a.map((v,i)=>`<div class="card"><strong>${esc(bookKey(v))}</strong><p>${esc(v.text)}</p><div class="toolbar"><button class="btn alt" onclick="goBookmark(${i})">Open chapter</button><button class="btn alt" onclick="removeBookmark(${i})">Remove</button></div></div>`).join(''):'<p class="muted">Tap a verse while reading the Bible to bookmark it.</p>'}`}
else if(screen==='journal'){let a=journal();content.innerHTML=`<div class="eyebrow">Private reflections</div><h2>My Prayer Journal</h2><div class="notice-box">Your journal stays in this browser unless you explicitly export it or connect cloud syncing. Clearing browser data can erase it. Avoid storing highly sensitive information.</div><div class="card"><label for="journalText"><strong>What is on your heart?</strong></label><textarea id="journalText" placeholder="Write a prayer, reflection, or answered prayer…"></textarea><p><button class="btn" onclick="saveJournal()">Save journal entry</button></p></div><div class="row"><strong>${a.length} entries</strong><span class="muted">${a.filter(x=>x.answered).length} answered</span></div>${a.map(x=>`<div class="card"><div class="journal-entry"><small>${new Date(x.date).toLocaleDateString()} ${x.day?'· Day '+esc(x.day)+': '+esc(x.theme||''):''} ${x.answered?'· ✓ Answered':''}</small>${esc(x.text)}</div><div class="toolbar"><button class="btn alt" data-answer="${esc(x.id)}">${x.answered?'Mark ongoing':'Mark answered'}</button><button class="btn alt" data-delete="${esc(x.id)}">Delete</button></div></div>`).join('')}`;content.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>toggleAnswered(x.dataset.answer));content.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>deleteJournal(x.dataset.delete))}
else if(screen==='more'){content.innerHTML=`<div class="eyebrow">Personalize your journey</div><h2>Settings & Account</h2><div class="card"><div class="field"><label for="displayName">Your first name (optional)</label><input id="displayName" type="text" maxlength="50" value="${esc(name)}" placeholder="How should we greet you?"></div><button class="btn" onclick="changeName()">Save name</button><div class="field"><label>Reading text size</label><div class="toolbar"><button class="btn alt" onclick="setFont(-2)">A−</button><button class="btn alt" onclick="setFont(2)">A+</button><span id="fontLabel">${get('fontSize',18)}px</span></div></div></div><div class="card"><h3>Daily reading reminder</h3><p class="notice">This is an in-app reminder. It appears when you open Men of Purpose after your chosen time; it cannot notify you while the app is closed.</p><div class="field"><label><input id="reminderEnabled" type="checkbox" ${rem.enabled?'checked':''} style="width:auto"> Enable daily reminder</label></div><div class="field"><label for="reminderTime">Reminder time</label><input type="time" id="reminderTime" value="${esc(rem.time||'09:00')}"></div><button class="btn" onclick="reminderSave()">Save reminder</button></div><div class="card"><h3>Backup & transfer</h3><p class="muted">Export your private data to a file or restore it on another device. Keep backup files secure.</p><div class="toolbar"><button class="btn" onclick="exportData()">Download backup</button><button class="btn alt" onclick="importData()">Import backup</button></div><input type="file" id="backupFile" accept=".json,application/json" style="display:none" onchange="restoreData(this)"></div><div class="card"><h3>Account & cloud sync</h3><div id="cloudPanel"></div></div><p class="notice">Men of Purpose · Free for readers · WEB Bible text loads from bible-api.com. We do not run ads or analytics in this version.</p>`;renderCloud()}
}
</script><script src="mop-accounts.js"></script><script>
render();window.addEventListener('load',()=>initCloud().then(()=>{if(screen==='more')renderCloud()}));reminderCheck();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script><script src="mop-languages.js"></script></body></html>
