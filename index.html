<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142e25"><meta name="description" content="Men of Purpose: rooted in Christ, strengthened by faith, called to lead."><link rel="manifest" href="manifest.webmanifest"><title>Men of Purpose</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#19352b;background:#f7f5ed}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100dvh;background:#f7f5ed;padding-bottom:85px}header{background:#142e25;color:#fff;padding:26px 22px 30px;border-radius:0 0 26px 26px}header small{color:#d6bd83;letter-spacing:.1em;font-size:10px}h1{font-family:Georgia,serif;font-size:33px;margin:10px 0 6px}header p{color:#e4e5d9;margin:0;font-size:13px}main{padding:20px}.eyebrow{font-size:11px;letter-spacing:.11em;color:#8b723c;font-weight:800;text-transform:uppercase}.card{background:white;border:1px solid #e6e3d9;border-radius:18px;padding:19px;margin-bottom:14px;box-shadow:0 3px 12px #132f2410}h2{font-family:Georgia,serif;font-size:25px;margin:7px 0 12px}h3{font-size:17px;margin:8px 0}.verse{border-left:3px solid #c6a15b;padding:8px 12px;background:#f8f6ef;font-style:italic;line-height:1.5}.muted{color:#63736b;font-size:13px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#173d2d;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#eae4d5;color:#244131}.btn:focus-visible,nav button:focus-visible{outline:3px solid #c6a15b;outline-offset:2px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.progress{height:10px;background:#e8e5db;border-radius:30px;overflow:hidden}.bar{height:100%;background:#c6a15b;transition:width .2s}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:15px 0}.day{background:#fff;border:1px solid #d8d9cf;border-radius:12px;min-height:58px;color:#244131;font-weight:700;cursor:pointer}.day.done{background:#e4eee4;border-color:#76997c}.day.active{outline:2px solid #c6a15b}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #ddd;padding:10px 6px max(10px,env(safe-area-inset-bottom))}nav button{background:transparent;border:0;padding:9px;color:#596b61;font-weight:700}nav button.active{color:#125035;border-radius:10px;background:#e9f0e8}textarea{width:100%;min-height:130px;border:1px solid #d4d7ce;border-radius:12px;padding:12px;font:inherit}footer{text-align:center;font-size:11px;color:#758177;margin:20px 0}.notice{font-size:12px;color:#6c695d}a{color:#286346}button:disabled{opacity:.5}</style></head><body><div class="app"><header><small>AN INITIATIVE OF TRIPLE J'S SOLUTIONS ENTERPRISES LTD.</small><h1>MEN OF PURPOSE</h1><p>Rooted in Christ. Strengthened by Faith. Called to Lead.</p></header><main id="content" aria-live="polite"></main><nav aria-label="Main navigation"><button id="homeTab" onclick="tab('home')">⌂ Home</button><button id="journeyTab" onclick="tab('journey')">◫ Journey</button><button id="journalTab" onclick="tab('journal')">✎ Journal</button></nav></div><script>
const themes=['You Are a New Creation','You Are God’s Workmanship','Strength in Your Weakness','Leading Through Love','Trusting God in Hardship','Courage Over Fear','Called to Make a Difference','Seek God First','Pray Without Ceasing','Practice Gratitude','Love Your Neighbor','Choose Forgiveness','Walk in Humility','Speak Truth','Listen Before Speaking','Pursue Peace','Guard Your Heart','Stand Against Temptation','Practice Self-Control','Serve Others','Honor Your Family','Lead With Patience','Work With Integrity','Give Generously','Trust God With Money','Persevere in Trials','Encourage a Brother','Be a Peacemaker','Choose Compassion','Act Justly','Be Faithful in Small Things','Grow in Wisdom','Renew Your Mind','Be Accountable','Walk in the Light','Make Time for Rest','Share Your Faith','Mentor Another Man','Build a Legacy of Love','Stand Firm in Faith'];
const readings=[
{ref:'2 Corinthians 5:17',body:'Your past is part of your story, but it does not have to be your identity. In Christ, you are invited into a new life. Today, refuse to let yesterday’s failures write tomorrow’s decisions.',prayer:'Father, help me live as someone renewed by Your grace. Give me courage to leave old patterns behind.',challenge:'Encourage one man who needs a fresh start.'},
{ref:'Ephesians 2:10',body:'You are not an accident or an afterthought. God made you with intention. Your worth is not measured by your paycheck, title, or applause. Look for one good thing you can do faithfully today.',prayer:'Lord, open my eyes to the good work You have prepared for me.',challenge:'Do one unseen act of service.'},
{ref:'2 Corinthians 12:9',body:'Strength is not pretending you never struggle. When you admit your limits and lean on God, weakness can become a place of trust instead of shame.',prayer:'Jesus, meet me in the places where I feel inadequate.',challenge:'Tell a trusted brother one area where you need prayer.'},
{ref:'Ephesians 5:25',body:'Godly leadership is not about control. It is about sacrificial love, patience, and care. Whether you are married or not, practice a love that puts another person’s well-being before your pride.',prayer:'Lord, teach me to love with humility and consistency.',challenge:'Show thoughtful care to someone close to you.'},
{ref:'Proverbs 3:5–6',body:'You may not know what comes next. Faith does not require a complete map. Bring your decisions before God, seek wise counsel, and take the next responsible step.',prayer:'Father, guide my decisions and keep me from relying only on myself.',challenge:'Pray about one decision before acting.'},
{ref:'Joshua 1:9',body:'Courage does not mean fear disappears. It means moving forward in obedience while trusting God’s presence. Today, take one small step you have been postponing.',prayer:'God, strengthen my heart and help me act with courage.',challenge:'Take one constructive step toward a difficult responsibility.'},
{ref:'Matthew 5:14–16',body:'Your faith is meant to shape how you treat people. Quiet integrity, compassion, and consistent service can bring light into ordinary places.',prayer:'Jesus, let my actions point others toward Your goodness.',challenge:'Help someone without seeking recognition.'}
];
const key='mop-v1-';const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(key+k))??d}catch{return d}};const put=(k,v)=>localStorage.setItem(key+k,JSON.stringify(v));let screen='home',selected=1;const content=document.getElementById('content');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function completed(){return get('completed',[])}function tab(s){screen=s;render()}function openDay(n){selected=n;screen='reader';render()}function mark(){let a=completed();if(!a.includes(selected))a.push(selected);put('completed',a);render()}function share(){let t=`Men of Purpose — Day ${selected}: ${themes[selected-1]}\nRead ${readings[selected-1]?.ref||'today’s Scripture'} and reflect on God’s purpose for your life.`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Message copied.'));else alert(t)}function render(){for(let t of ['home','journey','journal'])document.getElementById(t+'Tab').classList.toggle('active',screen===t);let count=completed().length;if(screen==='home'){content.innerHTML=`<div class="card"><div class="eyebrow">Today's encouragement</div><h2>You Are a New Creation</h2><p class="muted">Day 1 · 2 Corinthians 5:17 (NLT reference)</p><p>You are not defined by your past. In Christ, a new beginning is possible.</p><button class="btn" onclick="openDay(1)">Read devotional →</button></div><div class="card"><div class="row"><strong>Your 40-day journey</strong><span class="muted">${count}/40 completed</span></div><div class="progress" role="progressbar" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="40"><div class="bar" style="width:${count/40*100}%"></div></div><p class="muted">Grow in faith, character, family, and purpose—one day at a time.</p><button class="btn alt" onclick="tab('journey')">Explore the journey</button></div><div class="card"><strong>Our mission</strong><p>Encouraging men to discover their identity in Christ and lead with faith, humility, and love.</p></div>`}else if(screen==='journey'){content.innerHTML=`<div class="eyebrow">Your faith journey</div><h2>40 Days of Purpose</h2><p class="muted">${count} completed. The first seven devotionals are available in this prototype; days 8–40 are planned topics.</p><div class="progress"><div class="bar" style="width:${count/40*100}%"></div></div><div class="days">${themes.map((_,i)=>`<button class="day ${completed().includes(i+1)?'done':''}" onclick="openDay(${i+1})" aria-label="Day ${i+1}: ${esc(themes[i])}">${i+1}${i<7?'':' ·'}</button>`).join('')}</div><p class="notice">Days marked with a dot are upcoming and not yet written.</p>`}else if(screen==='reader'){let d=readings[selected-1];content.innerHTML=`<button class="btn alt" onclick="tab('journey')">← Back to journey</button><div class="card" style="margin-top:15px"><div class="eyebrow">Day ${selected} of 40</div><h2>${esc(themes[selected-1])}</h2>${d?`<p class="verse"><strong>Read:</strong> ${esc(d.ref)} (NLT)<br><span class="notice">Open your Bible app to read the passage in full.</span></p><h3>Today's reflection</h3><p>${esc(d.body)}</p><h3>Prayer</h3><p>${esc(d.prayer)}</p><h3>Today's challenge</h3><p>${esc(d.challenge)}</p><div class="row"><button class="btn" onclick="mark()">${completed().includes(selected)?'✓ Completed':'Mark complete'}</button><button class="btn alt" onclick="share()">Share</button></div>`:`<p class="muted">Coming soon. This day is a planned theme; devotional content is not yet available.</p>`}</div>`}else{content.innerHTML=`<div class="eyebrow">Private reflection</div><h2>My Prayer Journal</h2><div class="card"><p class="muted">Your notes are stored only in this browser on this device. Clearing browser data may erase them.</p><label for="notes"><strong>What is on your heart today?</strong></label><textarea id="notes" placeholder="Write a prayer or reflection..."></textarea><p><button class="btn" onclick="put('notes',document.getElementById('notes').value);alert('Saved on this device.')">Save journal</button></p></div>`;document.getElementById('notes').value=get('notes','')}}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
